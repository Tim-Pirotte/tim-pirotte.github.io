---
layout: default
---

<article id="post">
  <header>
    <h1>{{ page.title }}</h1>
    <h2>{{ page.description }}</h2>
    <h3>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </h3>
    <ul>
      {% for label in page.labels %}
      <li>{{ label.name }}</li>
      {% endfor %}
    </ul>
  </header>
  {{ content }}
</article>
