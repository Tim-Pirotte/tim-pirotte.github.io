<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  <link rel="alternate" title="RSS Feed" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/about.html' | relative_url }}">About</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>
    <p>
      {{ site.time | date: "%Y" }} {{ site.title }}
      <br>
      Images from <a href="https://bettysgraphics.neocities.org">bettysgraphics.neocities.org</a>
    </p>
  </footer>
</body>
</html>
