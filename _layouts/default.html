<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - Tim</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/reset.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/default_theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/minimal_theme.css' | relative_url }}">
  <script type="module" src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script type="module" src="{{ '/assets/js/window.js' | relative_url }}"></script>
  {% for script in page.scripts %}
  <script type="module" src="{{ '/assets/js/' | append: script | relative_url }}"></script>
  {% endfor %}
  <link rel="alternate" title="RSS Feed" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="hide window YmFzZTY0LWlzLXBhZ2U=" id="error-window">
    <p class="or-is-there">Nothing to see here!</p>
    <button id="close-window">Ok</button>
  </div>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button id="toggle-theme">Minimal theme</button>
  </header>
  <div id="middle">
    <nav class="window">
      <div class="hide window-icons">
        <div class="minimize"></div>
        <div class="full-screen"></div>
        <div class="close"></div>
      </div>
      <div>
        <h2>Navigation</h2>
        <ul>
          <li class="nav-icon" id="nav-home">
            <a href="{{ '/' | relative_url }}">Home</a>
          </li>
          <li class="nav-icon" id="nav-projects">
            <a href="{{ '/projects.html' | relative_url }}">Projects</a>
          </li>
          <li class="nav-icon" id="nav-posts">
            <a href="{{ '/posts.html' | relative_url}}">Posts</a>
          </li>
          <li class="nav-icon" id="nav-about">
            <a href="{{ '/about.html' | relative_url }}">About</a>
          </li>
          <li class="nav-icon" id="nav-resume">
            <a href="{{ '/resume.html' | relative_url }}">Resume</a>
          </li>
        </ul>
      </div>
      <div>
        <h2>Links</h2>
        <ul>
          <li class="nav-icon" id="github">
            <a href="https://github.com/Tim-Pirotte">Github</a>
          </li>
          <li class="nav-icon" id="linkedin">
            <a href="https://www.linkedin.com/in/tim-pirotte">LinkedIn</a>
          </li>
          <li class="nav-icon" id="rss">
            <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          </li>
        </ul>
      </div>
    </nav>
    <main>{{ content }}</main>
  </div>
  <footer>
    <p>Images from <a href="https://bettysgraphics.neocities.org">bettysgraphics.neocities.org</a></p>
  </footer>
</body>
</html>
