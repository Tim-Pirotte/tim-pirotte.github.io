---
layout: default
title: Posts
scripts:
  - posts.js
---

<h1>Posts</h1>
<div id="posts">
  <ul>
    {% for post in site.posts %}
      <li>
        <div class="top">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <ul>
            {% for label in post.labels %}
            <li>
              <a href="{{ '/posts' | relative_url }}?label={{ label.name | slugify | uri_escape }}">
              #{{ label.name }}
              </a>
            </li>
            {% endfor %}
          </ul>
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
        </div>
        <p>{{ post.description }}</p>
      </li>
    {% endfor %}
  </ul>
</ul>
